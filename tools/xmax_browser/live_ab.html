<!doctype html>
<meta charset="utf-8">
<title>live A/B - real camera</title>
<style>
 :root{--panel:#ffffff14;--line:#ffffff2a;--txt:#f4f6fb;
   --dim:#b9c0d4;--acc:#8b5cf6;--acc2:#22d3ee}
 *{box-sizing:border-box}
 html,body{height:100%}
 @keyframes drift{0%{background-position:0% 50%}50%{background-position:100% 50%}
   100%{background-position:0% 50%}}
 body{margin:0;color:var(--txt);display:flex;flex-direction:column;
   font:14px/1.4 -apple-system,"SF Pro Text",system-ui,sans-serif;
   background:linear-gradient(130deg,#0f0c29,#1a1a40,#24243e,#0f2027,#2c1a4d);
   background-size:400% 400%;animation:drift 25s ease infinite}
 #bar{padding:12px 16px 8px;display:flex;gap:10px;align-items:center;
   flex:0 0 auto}
 #bar .logo{font-weight:700;letter-spacing:.08em;font-size:13px;
   color:var(--acc);white-space:nowrap}
 #attach{border-radius:50%;width:42px;height:42px;padding:0;font-size:20px;
   flex:0 0 auto}
 #prompt{flex:1;min-width:200px;background:var(--panel);color:var(--txt);
   border:1px solid var(--line);border-radius:14px;padding:11px 16px;
   font:15px inherit;outline:none;backdrop-filter:blur(14px);
   transition:all .2s}
 #prompt::placeholder{color:var(--dim)}
 #prompt:focus{border-color:var(--acc);box-shadow:0 0 0 3px #8b5cf640}
 button{background:var(--panel);color:var(--txt);border:1px solid var(--line);
   border-radius:14px;padding:11px 18px;font:14px inherit;cursor:pointer;
   backdrop-filter:blur(14px);transition:all .2s;white-space:nowrap}
 button:hover{border-color:var(--acc);transform:translateY(-1px)}
 #apply{background:linear-gradient(90deg,var(--acc),var(--acc2));
   color:#fff;border:none;font-weight:650;box-shadow:0 4px 18px #8b5cf655}
 #apply:hover{filter:brightness(1.1);transform:translateY(-1px)}
 #chips{padding:0 16px 10px;display:flex;gap:8px;flex-wrap:wrap;flex:0 0 auto}
 .chip{background:var(--panel);border:1px solid var(--line);color:var(--dim);
   border-radius:999px;padding:6px 14px;font-size:12.5px;cursor:pointer;
   backdrop-filter:blur(14px);transition:all .2s}
 .chip:hover{color:#fff;border-color:var(--acc);transform:translateY(-1px);
   box-shadow:0 4px 14px #8b5cf640}
 .row{display:flex;gap:10px;padding:0 16px 12px;flex:1 1 auto;min-height:0}
 .pane{flex:1;position:relative;background:#05070acc;min-height:0;
   border-radius:18px;overflow:hidden;border:1px solid var(--line);
   box-shadow:0 12px 40px #00000066}
 .pane video{width:100%;height:100%;object-fit:contain;display:block}
 .tag{position:absolute;top:12px;left:14px;background:#0009;
   backdrop-filter:blur(6px);padding:5px 14px;font-size:15px;font-weight:600;
   border-radius:8px;z-index:2}
 .st{position:absolute;bottom:12px;left:14px;background:#0009;
   backdrop-filter:blur(6px);padding:5px 12px;font-size:12px;color:var(--dim);
   max-width:92%;border-radius:8px;z-index:2}
 #gst{color:var(--dim);font-size:12.5px;padding:0 16px 8px}
 .diag{position:absolute;top:12px;right:14px;background:#000a;
   backdrop-filter:blur(8px);padding:8px 10px;border-radius:10px;z-index:2;
   font:11px/1.5 ui-monospace,Menlo,monospace;color:#cfd6e6;min-width:150px}
 .diag .alert{color:#f87171;font-weight:700}
 .diag canvas{display:block;margin-top:5px;border-radius:4px;background:#ffffff10}
 #cam{position:fixed;right:24px;bottom:24px;width:220px;border-radius:14px;
   border:1px solid var(--line);box-shadow:0 12px 40px #000a;z-index:5}
</style>
<div id="bar">
  <span class="logo" style="background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:15px">LIVE&nbsp;A/B</span>
  <button id="attach" title="attach a reference image (clothes, objects, style) and tell the model what to do with it">＋</button>
  <span id="refchip" style="display:none;position:relative">
    <img id="refthumb" style="height:38px;border-radius:8px;border:1px solid var(--line);display:block">
    <span id="refx" style="position:absolute;top:-7px;right:-7px;background:#f87171;color:#fff;border-radius:50%;width:17px;height:17px;font-size:11px;line-height:17px;text-align:center;cursor:pointer">×</span>
  </span>
  <input id="prompt" type="text" placeholder="describe a style — or attach an image and say what to do with it…"
         value="oil painting style, thick impasto brush strokes, warm palette">
  <button id="apply">Apply to both</button>
  <input id="reffile" type="file" accept="image/*" style="display:none">
  <button id="langbtn" title="auto-translate: English prompt -> Chinese for Xmax, Chinese -> English for Lucy">译 Auto-translate: OFF</button>
  <button id="diagbtn" title="live breakdown tracking: delivered fps, stalls, scene drift vs the first 5s, motion pops">Diagnostics: ON</button>
  <button id="crop" title="zoom in ~14% to push edge watermarks out of view">Hide watermarks</button>
  <button id="reveal">Reveal sides</button>
</div>
<div id="chips"></div>
<div id="gst"></div>
<div class="row">
  <div class="pane"><video id="v0" muted autoplay playsinline></video>
    <div class="tag" id="t0">A</div><div class="st" id="s0">idle</div>
    <div class="diag" id="d0" style="display:none"></div></div>
  <div class="pane"><video id="v1" muted autoplay playsinline></video>
    <div class="tag" id="t1">B</div><div class="st" id="s1">idle</div>
    <div class="diag" id="d1" style="display:none"></div></div>
</div>
<video id="cam" muted autoplay playsinline></video>
<script src="./vendor/cos-umd.js"></script>
<script type="importmap">
{"imports": {
  "@volcengine/rtc": "./vendor/volc-rtc.esm.js",
  "cos-js-sdk-v5": "./vendor/cos-real.js",
  "heic-to/csp": "./vendor/stub-heic.js"
}}
</script>
<script type="module">
/* Same real camera into Lucy 2.5 (Decart, documented ws signaling) and
   Xmax X2.0 (vendored SDK, temp key) at once. Sides are randomized at load
   and hidden until 'reveal' - eyeball first, identity second. Not a
   measurement: nothing here is recorded or timestamped as evidence. */
const q = new URLSearchParams(location.search);
const decartKey = q.get("decart"), xmaxKey = q.get("xmax");
const gst = t => { document.getElementById("gst").textContent = t;
                   fetch("/log?m=" + encodeURIComponent(t)).catch(()=>{}); };
window.addEventListener("unhandledrejection",
  e => gst("REJECTION: " + (e.reason?.message || e.reason)));

const swap = Math.random() < 0.5;          // eyeball-blinding coin flip
const side = {lucy: swap ? 1 : 0, xmax: swap ? 0 : 1};
const vid = i => document.getElementById("v" + i);
const names = {[side.lucy]: "lucy", [side.xmax]: "xmax"};
const st  = (i, t) => {
  document.getElementById("s" + i).textContent = t;
  fetch("/log?m=" + encodeURIComponent(names[i] + ": " + t)).catch(()=>{});
};
window.addEventListener("error",
  e => gst("JS ERROR: " + e.message + " @" + e.lineno));
let cropped = false;
document.getElementById("crop").onclick = () => {
  cropped = !cropped;
  for (const v of [vid(0), vid(1)])
    { v.style.transform = cropped ? "scale(1.14)" : "";
      v.style.objectFit = cropped ? "cover" : "contain"; }
  document.getElementById("crop").textContent =
    cropped ? "Show full frame" : "Hide watermarks";
};
document.getElementById("reveal").onclick = () => {
  document.getElementById("t" + side.lucy).textContent = "Lucy 2.5 (Decart)";
  document.getElementById("t" + side.xmax).textContent = "Xmax X2.0";
};

let cam;
async function camera() {
  try {
    cam = await navigator.mediaDevices.getUserMedia(
      {video: {width: 1280, height: 720, frameRate: 30}, audio: false});
  } catch (e) {
    gst("CAMERA BLOCKED (" + e.name + "). Fix: System Settings > Privacy & "
        + "Security > Camera > enable Google Chrome, then rerun.");
    st(0, "no camera - nothing to send");
    st(1, "no camera - nothing to send");
    throw e;
  }
  document.getElementById("cam").srcObject = cam;
}

/* ---------------- Lucy: documented signaling over /v1/stream ------------- */
let lucyWs;
async function startLucy() {
  const i = side.lucy;
  st(i, "connecting signaling...");
  lucyWs = new WebSocket("wss://api.decart.ai/v1/stream?api_key="
                         + encodeURIComponent(decartKey) + "&model=lucy-2.5");
  const pc = new RTCPeerConnection();
  pc.oniceconnectionstatechange = () => {
    if (["failed", "disconnected"].includes(pc.iceConnectionState))
      st(i, "media path " + pc.iceConnectionState
            + " - VPN is likely blocking UDP (use the WireGuard config)");
  };
  pc.ontrack = e => {
    vid(i).srcObject = e.streams[0];
    st(i, "negotiated - waiting for frames...");
    setTimeout(() => {
      st(i, vid(i).videoWidth > 0
        ? "frames flowing (" + vid(i).videoWidth + "x" + vid(i).videoHeight + ")"
        : "negotiated but NO FRAMES after 10s - VPN blocking UDP media; "
          + "switch to the WireGuard config and rerun");
    }, 10000);
  };
  pc.onicecandidate = e => { if (e.candidate)
    lucyWs.send(JSON.stringify({type: "ice-candidate",
                                candidate: e.candidate.toJSON()})); };
  const track = cam.getVideoTracks()[0].clone();
  const tx = pc.addTransceiver(track, {direction: "sendrecv",
                                       streams: [new MediaStream([track])]});
  /* mirror the validated adapter: prefer H264 upstream */
  if (RTCRtpSender.getCapabilities) {
    const codecs = RTCRtpSender.getCapabilities("video").codecs;
    const h264 = codecs.filter(c => /H264/i.test(c.mimeType));
    if (h264.length && tx.setCodecPreferences)
      tx.setCodecPreferences([...h264,
        ...codecs.filter(c => !/H264/i.test(c.mimeType))]);
  }
  const pending = [];
  lucyWs.onmessage = async ev => {
    const m = JSON.parse(ev.data);
    if (m.type === "answer") {
      await pc.setRemoteDescription({type: "answer", sdp: m.sdp});
      for (const c of pending.splice(0)) await pc.addIceCandidate(c);
    } else if (m.type === "ice-candidate") {
      if (pc.remoteDescription) await pc.addIceCandidate(m.candidate);
      else pending.push(m.candidate);
    } else if (m.type === "session_id") { st(i, "session " + m.session_id.slice(0, 8));
    } else if (m.type === "prompt_ack") { st(i, "prompt " + (m.success ? "applied" : "REJECTED"));
    } else if (m.type === "generation_ended") { st(i, "ENDED: " + m.reason); }
  };
  await new Promise((res, rej) => { lucyWs.onopen = res;
                                    lucyWs.onerror = () => rej(new Error("ws failed")); });
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  lucyWs.send(JSON.stringify({type: "offer", sdp: pc.localDescription.sdp}));
  sendLucyPrompt();
}
function sendLucyPrompt(text) {
  if (lucyWs?.readyState === 1)
    lucyWs.send(JSON.stringify({type: "prompt",
      prompt: text ?? document.getElementById("prompt").value,
      enhance_prompt: false}));
}

/* ---------------- Xmax: vendored SDK, temp key --------------------------- */
let xmaxSession, xmaxApi;
async function startXmax() {
  const i = side.xmax;
  st(i, "connecting SDK...");
  const {createXmaxClient, models} = await import("./vendor/index.js");
  const xmaxClient = createXmaxClient({apiKey: xmaxKey});
  xmaxApi = xmaxClient;
  /* connect() returns the session object; live updates go through it */
  xmaxSession = await xmaxClient.realtime.connect(
    new MediaStream([cam.getVideoTracks()[0].clone()]), {
      model: models.realtime("x2.0"),
      /* SDK reads options.context.prompt; a top-level prompt is silently
         ignored (found live: output was a passthrough mirror) */
      context: Object.assign(
        {prompt: document.getElementById("prompt").value},
        refUrl ? {refImageUrl: refUrl} : {}),
      onRemoteStream: s => {
        /* fires several times (audio/video arrive as separate streams) -
           only take streams that actually carry video, never overwrite a
           playing one with a videoless one */
        const nv = s.getVideoTracks().length;
        st(i, "remote stream (video tracks: " + nv + ")");
        if (nv > 0) {
          vid(i).srcObject = s;
          setTimeout(() => st(i, vid(i).videoWidth > 0
            ? "frames flowing (" + vid(i).videoWidth + "x" + vid(i).videoHeight + ")"
            : "video track present but no frames after 8s"), 8000);
        }
      },
    });
}

const PRESETS = [
  // global restyles
  "oil painting style, thick impasto brush strokes, warm palette",
  "anime style, cel shading, vibrant colors",
  "cyberpunk neon city, rain, holographic glow",
  "black and white 1920s film noir, heavy grain",
  "vintage comic book, halftone dots, bold ink outlines",
  // additive / compositional - tests object insertion + spatial adherence
  "a small red dragon perched on my shoulder",
  "an anime girl standing next to me waving",
  "glowing butterflies flying around my head",
  "a golden crown on my head, royal velvet cape",
  "a grey cat sitting on the desk in front of me",
  "fireworks exploding in the sky behind me",
];
const chips = document.getElementById("chips");
for (const p of PRESETS) {
  const c = document.createElement("span");
  c.className = "chip"; c.textContent = p.split(",")[0];
  c.title = p;
  c.onclick = () => { document.getElementById("prompt").value = p;
                      document.getElementById("apply").click(); };
  chips.appendChild(c);
}
document.getElementById("prompt").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("apply").click();
});

/* ------- reference image, composer-style (Xmax; Lucy has no ref API) ----- */
let refUrl = null;
document.getElementById("attach").onclick =
  () => document.getElementById("reffile").click();
document.getElementById("refx").onclick = () => {
  refUrl = null;
  document.getElementById("refchip").style.display = "none";
  st(side.xmax, "reference removed - next Apply is prompt-only");
};
document.getElementById("reffile").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  document.getElementById("refthumb").src = URL.createObjectURL(f);
  document.getElementById("refchip").style.display = "";
  if (!xmaxApi) { st(side.xmax, "not connected yet - image will upload on Apply"); }
  st(side.xmax, "uploading reference image...");
  try {
    const up = await (xmaxApi.files?.uploadImage ? xmaxApi.files.uploadImage(f)
                                                 : xmaxApi.uploadImage(f));
    refUrl = up.url;
    st(side.xmax, "image attached - now tell it what to do (e.g. \"put this "
       + "jacket on me\") and press Enter");
    st(side.lucy, "note: Lucy's realtime API has no reference-image input - "
       + "this side gets the text prompt only");
    document.getElementById("prompt").focus();
  } catch (err) { st(side.xmax, "ref upload failed: " + err.message); }
};

/* ------- optional EN<->ZH auto-translation via local /translate ---------- */
let autoLang = false;
document.getElementById("langbtn").onclick = () => {
  autoLang = !autoLang;
  document.getElementById("langbtn").textContent =
    "译 Auto-translate: " + (autoLang ? "ON" : "OFF");
};
async function bothLanguages(text) {
  if (!autoLang) return {en: text, zh: text};
  try {
    const r = await fetch("/translate", {method: "POST", body: text});
    if (!r.ok) throw new Error("translate " + r.status);
    return await r.json();   // {en, zh}
  } catch (e) {
    gst("translate unavailable (" + e.message + ") - using original");
    return {en: text, zh: text};
  }
}

document.getElementById("apply").onclick = async () => {
  const raw = document.getElementById("prompt").value;
  const t = await bothLanguages(raw);
  sendLucyPrompt(t.en);
  if (xmaxSession) {
    try {
      const ctx = {prompt: t.zh};
      if (refUrl) ctx.refImageUrl = refUrl;
      await xmaxSession.set(ctx);
      st(side.xmax, "applied" + (autoLang ? " (zh)" : "")
                    + (refUrl ? " + reference" : ""));
    } catch (e) { st(side.xmax, "prompt update failed: " + e.message); }
  }
};

/* debug self-screenshot: with ?snap=1, POST a composite of both panes +
   camera after 30s so the serving process can verify rendering headlessly */
if (q.get("snap")) setTimeout(() => {   // auto-exercise live prompt update
  document.getElementById("prompt").value = "black and white film noir, heavy grain";
  document.getElementById("apply").click();
}, 18000);
if (q.get("snap")) setTimeout(async () => {  // auto-exercise ref upload path
  try {
    const c = document.createElement("canvas"); c.width = c.height = 256;
    const x = c.getContext("2d");
    x.fillStyle = "#c33"; x.fillRect(0, 0, 256, 256);
    x.fillStyle = "#fff"; x.fillRect(60, 40, 136, 180);  // a "shirt"
    const blob = await new Promise(r => c.toBlob(r, "image/png"));
    const up = await (xmaxApi.files?.uploadImage
      ? xmaxApi.files.uploadImage(new File([blob], "shirt.png", {type: "image/png"}))
      : xmaxApi.uploadImage(new File([blob], "shirt.png", {type: "image/png"})));
    gst("REF UPLOAD OK: " + up.url.slice(0, 60));
    await xmaxSession.set({prompt: "recolor the entire scene to match the reference image", refImageUrl: up.url});
    gst("REF SET OK");
  } catch (e) { gst("REF TEST FAILED: " + e.message); }
}, 19000);
if (q.get("snap")) setTimeout(() => {
  const c = document.createElement("canvas");
  c.width = 1280; c.height = 400;
  const x = c.getContext("2d");
  x.fillStyle = "#222"; x.fillRect(0, 0, 1280, 400);
  try { x.drawImage(vid(0), 0, 0, 640, 360); } catch {}
  try { x.drawImage(vid(1), 640, 0, 640, 360); } catch {}
  try { x.drawImage(document.getElementById("cam"), 540, 340, 200, 60); } catch {}
  x.fillStyle = "#9f9"; x.font = "16px monospace";
  x.fillText("A: " + document.getElementById("s0").textContent, 10, 390);
  x.fillText("B: " + document.getElementById("s1").textContent, 650, 390);
  c.toBlob(b => fetch("/snap", {method: "POST", body: b}));
}, 30000);

/* ---- live breakdown tracking -------------------------------------------
   Browser-weight proxies of the harness instruments (labelled as such):
     fps        delivered frames (requestVideoFrameCallback), not render fps
     stall      >500ms without a new frame; breakdown alert at >=2s
     drift      colour-histogram cosine vs the clip's OWN first 5s (E.8-style
                long-horizon proxy; the real one uses DINO embeddings)
     pops       spikes in the 2nd difference of inter-frame change vs the
                clip's own median (E.7 jerk proxy)
   'breaking since T' latches at the first sustained drift<0.85 or stall>=2s. */
class PaneDiag {
  constructor(i) {
    this.i = i; this.v = vid(i);
    this.box = document.getElementById("d" + i);
    this.cv = document.createElement("canvas");
    this.cv.width = 96; this.cv.height = 54;
    this.cx = this.cv.getContext("2d", {willReadFrequently: true});
    this.spark = document.createElement("canvas");
    this.spark.width = 150; this.spark.height = 26;
    this.frames = 0; this.lastFrameAt = 0; this.fps = 0;
    this.stalls = 0; this.curStall = 0;
    this.ref = null; this.refN = 0; this.t0 = 0;
    this.prev = null; this.diffs = []; this.pops = 0;
    this.driftHist = []; this.breakAt = null; this.lowSince = null;
    const onFrame = (_, meta) => {
      this.frames++; this.lastFrameAt = performance.now();
      this.v.requestVideoFrameCallback(onFrame);
    };
    if (this.v.requestVideoFrameCallback) this.v.requestVideoFrameCallback(onFrame);
    setInterval(() => this.tick(), 250);
    setInterval(() => { this.fps = this.frames * 2; this.frames = 0; }, 500);
  }
  hist(d) {
    const h = new Float32Array(48);
    for (let p = 0; p < d.length; p += 16) {  // stride: every 4th px
      h[d[p] >> 4]++; h[16 + (d[p + 1] >> 4)]++; h[32 + (d[p + 2] >> 4)]++;
    }
    let n = 0; for (const x of h) n += x * x;
    n = Math.sqrt(n) || 1;
    return h.map(x => x / n);
  }
  tick() {
    if (!this.v.videoWidth) return;
    const now = performance.now();
    if (!this.t0) this.t0 = now;
    const tSec = (now - this.lastFrameAt) / 1000;
    this.curStall = this.lastFrameAt ? tSec : 0;
    if (this.curStall > 0.5 && this.curStall < 0.8) this.stalls++;
    this.cx.drawImage(this.v, 0, 0, 96, 54);
    const d = this.cx.getImageData(0, 0, 96, 54).data;
    const h = this.hist(d);
    // reference = mean histogram of the first 5s
    if (now - this.t0 < 5000) {
      if (!this.ref) this.ref = new Float32Array(48);
      for (let k = 0; k < 48; k++)
        this.ref[k] = (this.ref[k] * this.refN + h[k]) / (this.refN + 1);
      this.refN++;
    }
    let drift = 1;
    if (this.ref && now - this.t0 >= 5000) {
      let dot = 0, na = 0, nb = 0;
      for (let k = 0; k < 48; k++) { dot += h[k] * this.ref[k];
        na += h[k] * h[k]; nb += this.ref[k] * this.ref[k]; }
      drift = dot / Math.sqrt(na * nb || 1);
      this.driftHist.push(drift);
      if (this.driftHist.length > 150) this.driftHist.shift();
    }
    // pops: jerk in inter-frame change
    if (this.prev) {
      let s = 0;
      for (let p = 0; p < d.length; p += 16) s += Math.abs(d[p] - this.prev[p]);
      this.diffs.push(s);
      if (this.diffs.length > 40) this.diffs.shift();
      if (this.diffs.length > 6) {
        const j = Math.abs(this.diffs.at(-1) - 2 * this.diffs.at(-2) + this.diffs.at(-3));
        const med = [...this.diffs].sort((a, b) => a - b)[this.diffs.length >> 1] + 1;
        if (j > med * 4 && this.fps > 2) this.pops++;
      }
    }
    this.prev = d.slice();
    // breakdown latch
    const broken = (drift < 0.85) || this.curStall >= 2;
    if (broken) { if (!this.lowSince) this.lowSince = now;
      if (!this.breakAt && now - this.lowSince > 2000)
        this.breakAt = (now - this.t0) / 1000;
    } else this.lowSince = null;
    this.render(drift);
  }
  render(drift) {
    const mm = t => "%d:%02d".replace("%d", Math.floor(t / 60))
                             .replace("%02d", String(Math.floor(t % 60)).padStart(2, "0"));
    let html = "fps " + this.fps.toFixed(0)
      + " · stalls " + this.stalls
      + (this.curStall > 0.5 ? " <span class=alert>(stalled "
         + this.curStall.toFixed(1) + "s)</span>" : "")
      + "<br>drift " + (100 * (1 - drift)).toFixed(1) + "% · pops " + this.pops;
    if (this.breakAt != null)
      html += "<br><span class=alert>breaking since " + mm(this.breakAt) + "</span>";
    this.box.innerHTML = html;
    this.box.appendChild(this.spark);
    const g = this.spark.getContext("2d");
    g.clearRect(0, 0, 150, 26);
    g.strokeStyle = "#22d3ee"; g.beginPath();
    this.driftHist.forEach((v, k) => {
      const x = k * 150 / 150, y = 26 - Math.max(0, Math.min(1, (v - 0.7) / 0.3)) * 24;
      k ? g.lineTo(x, y) : g.moveTo(x, y);
    });
    g.stroke();
  }
}
let diags = null;
let diagOn = true;
function startDiag() {
  if (!diags) diags = [new PaneDiag(0), new PaneDiag(1)];
  document.getElementById("d0").style.display = diagOn ? "" : "none";
  document.getElementById("d1").style.display = diagOn ? "" : "none";
}
document.getElementById("diagbtn").onclick = () => {
  diagOn = !diagOn;
  document.getElementById("diagbtn").textContent =
    "Diagnostics: " + (diagOn ? "ON" : "OFF");
  startDiag();
};

(async () => {
  gst("camera...");
  await camera();
  gst("connecting both products");
  const jobs = [];
  if (decartKey) jobs.push(startLucy().catch(e => st(side.lucy, "ERR " + e.message)));
  else st(side.lucy, "no decart key passed");
  if (xmaxKey) jobs.push(startXmax().catch(e => st(side.xmax, "ERR " + e.message)));
  else st(side.xmax, "no xmax key passed");
  await Promise.allSettled(jobs);
  startDiag();
  gst("up - wave at the camera; reveal when you've formed an opinion");
})();
